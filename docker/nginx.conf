worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  access_log    /dev/stdout;
  client_max_body_size 1m;

  # Hot-asset gzipping. Voxel JS bundle is ~800 kB unminified.
  gzip on;
  gzip_types application/javascript text/css application/json image/svg+xml;
  gzip_min_length 1024;

  # The browser needs cross-origin isolation for SharedArrayBuffer-backed
  # voxel buffers. Both COOP and COEP must be set on every same-origin
  # response, including static assets and worker scripts.
  map $sent_http_content_type $coep_value {
    default "require-corp";
  }

  server {
    listen 8080 default_server;
    server_name _;
    root /srv/app;
    index index.html;

    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # AI brain: every action lives in the Node sidecar on :3030.
    location /ai/ {
      proxy_pass http://127.0.0.1:3030/ai/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # Session / lobby server.
    location /lobby/ {
      proxy_pass http://127.0.0.1:3040/lobby/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # Authoritative game engine. /game/stream is a Server-Sent Events
    # endpoint, so we disable proxy buffering and bump the read
    # timeout so the connection survives quiet ticks. Commands POST
    # to /game/input.
    location /game/stream {
      proxy_pass http://127.0.0.1:3050/game/stream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      chunked_transfer_encoding off;
    }
    location /game/ {
      proxy_pass http://127.0.0.1:3050/game/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }
    # /world/* are companion endpoints for game-server (chunk + edit
    # streaming). Phase 6 only ships /world/edits; later phases will
    # add /world/chunk/:cx/:cy/:cz for full chunk fetches.
    location /world/ {
      proxy_pass http://127.0.0.1:3050/world/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # Health checks: surface every backend through the proxy.
    location = /health/ai     { proxy_pass http://127.0.0.1:3030/health; }
    location = /health/lobby  { proxy_pass http://127.0.0.1:3040/health; }
    location = /health/game   { proxy_pass http://127.0.0.1:3050/health; }

    # SPA fallback — everything else is served from the built bundle.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
