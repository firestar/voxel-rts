# kaiad.yaml — voxel-rts.
#
# Two-pipeline layout:
#   voxel-rts-image  (kind=supporting) — runs `docker build` on the
#       repo's Dockerfile and publishes
#       panel.dev.kaiad.dev/voxel-rts-image:<git-sha>. Not deployed
#       to agents on its own.
#   voxel-rts        (kind=deployable) — depends on voxel-rts-image
#       and uses {voxel_rts_image_version} (the just-built SHA) as
#       the runtime image. The agents pull this versioned image and
#       run it on every successful main-branch build.
#
# Why split: makes the build artifact (the image) and the deploy
# (which version is running where) explicit and separable. Future
# changes to the deploy surface — env vars, scaling, domains — only
# touch the deployable side without re-triggering the build.

version: 1

services:
  # ── Image build ───────────────────────────────────────────────
  voxel-rts-image:
    # Built but NOT deployed to bound agents. Other pipelines pull
    # this image at deploy time via dependsOn + {version} interpolation.
    kind: supporting

    dockerfile:
      path: Dockerfile
      context: .

    # Declared so the panel surfaces the runtime port even though
    # the agent never deploys this pipeline directly.
    ports:
      - port: 8080
        name: http

    # No replicas, no domains — this is a base image.
    instances: 0
    domains: []
    loadBalancer:
      type: none

  # ── Deployable ────────────────────────────────────────────────
  voxel-rts:
    # Resolves at build time to the latest successful voxel-rts-image
    # build's git SHA. Substituted into runtime.image below.
    dependsOn:
      - voxel-rts-image

    # No build/artifacts of its own — the runtime is just the image
    # that voxel-rts-image just built. Crane re-tags
    # panel.dev.kaiad.dev/voxel-rts-image:<sha> →
    # panel.dev.kaiad.dev/voxel-rts:<sha> for the deploy.
    runtime:
      image: "{kaiad_registry_host}/voxel-rts-image:{voxel_rts_image_version}"
      command: ["/sbin/tini", "--", "/usr/local/bin/entrypoint.sh"]

    ports:
      - port: 8080
        name: http

    instances: 1

    domains:
      - host: voxelrts.com
        port: 8080
        protocol: https

    loadBalancer:
      type: nginx

    # Single environment — defaults from the top level apply verbatim.
    environments:
      production: {}
